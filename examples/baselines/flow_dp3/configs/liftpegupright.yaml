# Rigid batch 2: v7 terminal windows and real post-success hold.
policy:
  state_dim: 25
  action_dim: 7
  horizon: 16
  n_obs_steps: 2
  n_action_steps: 8
  radius1_m: 0.1
  radius2_m: 0.2
  length_scale: 1.0
  down_dims:
  - 512
  - 1024
  - 2048
  diffusion_step_embed_dim: 128
  kernel_size: 5
  n_groups: 8
  num_inference_steps: 10
  fm_eps: 0.01
  fm_time_scale: 100.0
  num_segments: 2
  boundary: 1
  delta: 0.01
  alpha: 1.0e-05
  noise_scale: 1.0
  sigma_var: 0.0
  solver: consistency
training:
  seed: 42
  batch_size: 32
  steps: 30000
  lr: 0.0001
  betas:
  - 0.95
  - 0.999
  weight_decay: 1.0e-06
  warmup_steps: 500
  val_ratio: 0.2
  val_every: 100
  val_batches: 4
  checkpoint_every: 100
  grad_clip: 1.0
  required_contract_version: 7
